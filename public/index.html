<script>
document.getElementById("main").innerHTML = '<section class="home-hero"><div class="in">\n  <div class="eyebrow">Agora Society Stands</div>\n  <h1>What Americans pay for health care and medicine, and who profits</h1>\n  <p>Independent, nonpartisan tracking built on public records: government price data, federal spending, SEC filings and enforcement actions. Every number links to its source. Then you get a say.</p>\n  <div class="chips"><span class="chip">No ads</span><span class="chip">No account needed</span><span class="chip">Every figure sourced</span></div>\n</div></section>\n<div class="content">\n  <div id="installSlot"></div>\n  <section class="card mission"><div class="card-b"><div class="eyebrow" style="margin:0">Why we&rsquo;re here</div><h2>For our children, and for everyone&rsquo;s children</h2><p>Agora is built for our children, our grandchildren, and every generation that follows. Each of us inherited a world shaped by the people who came before us, and each of us owes it to those who come next to leave the world, and our own communities, better than we found them.</p><p>Individual rights are essential. So is our responsibility to one another. Agora is nonpartisan and altruistic: it serves no party and no company, only the common good. A healthy society meets the needs of everyone, not only the goals of a few, and the deepest happiness comes from our relationships and from serving others.</p><a class="go" href="about/index.html#why">Read our purpose &rarr;</a></div></section>\n  <div class="act-band"><div><div class="eyebrow" style="margin:0">Take action</div><h2>It only works if <u>you</u> take part.</h2><p>Don\'t like what you see? What are you going to do about it? <b>Participate</b> regularly. <b>Offer</b> your own ideas. <b>Take lawful steps</b> to change your government and society. And most important, <b>spread the word</b> to at least 10 other people.</p></div><a class="btn" href="act/index.html#you">Take action →</a></div>\n  <div class="qs">\n    <a class="card prod-card" href="pharma/index.html"><span class="eyebrow" style="margin:0">Agora Pharma</span><h2>The price of medicine</h2>\n      <p class="q">Prescription drug prices have risen 684% since 1980, more than twice as fast as everything else. Brand-name drugs cost Americans 4.22 times what 33 other wealthy countries pay.</p>\n      <ul><li>Drug prices against inflation, 1950 to today</li><li>U.S. prices against the world</li><li>Taxpayer grants behind each drug</li><li>Pfizer, Merck, J&amp;J, AbbVie, Lilly, Bristol Myers</li></ul><span class="go">Open Agora Pharma →</span></a>\n    <a class="card prod-card" href="health/index.html"><span class="eyebrow" style="margin:0">Agora Health</span><h2>The price of coverage</h2>\n      <p class="q">The U.S. spends $14,775 per person on health care, nearly twice what peer countries spend. Marketplace insurers denied 19% of in-network claims in 2024; fewer than 1% were appealed.</p>\n      <ul><li>Where $5.3 trillion goes</li><li>Denials and how to appeal</li><li>Medicare Advantage overpayments</li><li>UnitedHealth, Elevance, CVS, Cigna, Humana, Centene</li></ul><span class="go">Open Agora Health →</span></a>\n  </div>\n  <section class="card road"><div class="card-b"><div class="eyebrow" style="margin:0">Where Agora is going</div><h2>Health care is only the beginning</h2><p>Agora starts with what we pay for medicine and coverage. Next it follows the money into lobbying, campaigns and public budgets, then sets public standards for ethical leadership, organizes locally, reports independently, opens direct citizen participation and grows worldwide.</p><ol class="road-steps"><li class="on"><span>Live now</span><b>Pharma &amp; Health</b></li><li class=""><span>Next</span><b>Agora Ledger</b></li><li class=""><span>Planned</span><b>Antisociopath Society</b></li><li class=""><span>Planned</span><b>Agora Civic</b></li><li class=""><span>Planned</span><b>Agora Media</b></li><li class=""><span>Planned</span><b>Agora Democratic</b></li><li class=""><span>Future</span><b>Worldwide</b></li></ol><a class="go" href="about/index.html#roadmap">See all future phases &rarr;</a></div></section>\n  <div class="sec-h">The companies</div>\n  <div class="co-row" id="coRow"></div>\n  <div class="card"><div class="card-h"><div><h3>Have your say</h3><div class="sub">Advisory shareholder ballots on every company page, plus public polls on drug pricing and coverage.</div></div><div class="right"><a class="btn" href="polls/index.html">Vote in polls</a></div></div></div>\n</div>';
document.getElementById("installSlot").innerHTML = Agora.installCard();
document.getElementById("coRow").innerHTML = AGORA_COMPANIES.map(c => `<a class="card co-link" href="company/index.html#${c.t}"><span class="n">${Agora.esc(c.name)}</span><span class="s"><span class="tick">${c.t}</span> · ${c.s === "pharma" ? "Drugmaker" : "Insurer"} · ${c.pay ? "CEO pay $" + c.pay.toFixed(1) + "M" : "CEO " + Agora.esc(c.ceo)}</span></a>`).join("");
</script>
