<script>document.getElementById("main").innerHTML = '<header class="hero"><div class="hero-in"><div class="eyebrow">Privacy</div><h1>Privacy policy</h1><p>Effective on launch. Short version: no accounts, no ads, no tracking cookies, and we never sell data.</p></div></header>\n<div class="content"><div class="prose">\n<h2>What we collect</h2>\n<ul><li><b>Votes and polls.</b> When you vote, your browser sends a random ID created on your device. We store a one-way, salted hash of that ID with your vote so each device votes once. We do not store your name, email or IP address with votes.</li>\n<li><b>Abuse prevention.</b> To limit spam, we count requests per day using a hash of your IP address that changes daily. It is not linked to your votes, and old counts are deleted after each day.</li>\n<li><b>Polls you create</b> are public, along with their date.</li>\n<li><b>Hosting logs.</b> Our host, Vercel, processes standard request data (such as IP address and browser type) to deliver and secure the site. See Vercel\'s privacy policy at vercel.com/legal/privacy-policy.</li>\n<li><b>Your settings</b>, such as theme and your own votes, are saved in your browser\'s local storage and never leave your device except as described above.</li></ul>\n<h2>What we don\'t do</h2>\n<ul><li>No advertising or ad trackers.</li><li>No sale or sharing of personal data.</li><li>No health information is requested or stored. Please don\'t put personal medical details in polls.</li></ul>\n<h2>Third-party data</h2>\n<p>Pages show public data from government agencies, SEC filings and research organizations. Links to those sources open their websites, which have their own policies.</p>\n<h2>Children</h2><p>The site is intended for adults and is not directed to children under 13.</p>\n<h2>Contact</h2><p>privacy@agorasocietystands.com</p>\n</div></div>';</script>
