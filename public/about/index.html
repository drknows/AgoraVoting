<script>document.getElementById("main").innerHTML = '<header class="hero"><div class="hero-in"><div class="eyebrow">About</div><h1>Leave it better than we found it</h1><p>Agora Society Stands is a nonpartisan, altruistic effort to serve the common good. It tracks what Americans pay for health care and medicine, and who profits, using only figures we can trace to a public source.</p></div></header>\n<div class="content"><div class="prose">\n<h2 id="why">Why Agora exists</h2>\n<p>The inspiration for Agora is our children, and the children, grandchildren and future generations of everyone. We believe each of us has a duty to leave the world better than we found it, and to leave our communities better than we found them.</p>\n<p>Too often, public life rewards narrow individual goals over the needs of society as a whole. Individual rights are critical, and Agora defends them. But a healthy society also asks us to serve our communities and one another. Relationships and service to others are among the truest sources of happiness, and they are the foundation of honest government and ethical business.</p>\n<h2 id="values">What we stand for</h2>\n<ul><li><b>Future generations:</b> we judge decisions by what they leave to those who come after us.</li>\n<li><b>Nonpartisan:</b> Agora serves no party or candidate. Frustration with dishonest power is shared across the political spectrum, and so are the solutions.</li>\n<li><b>Altruistic:</b> Agora exists to serve the public, not to profit from it. No ads, and no money from the companies we track.</li>\n<li><b>Community and service:</b> we pair individual rights with responsibility to one another, and we invite everyone to take part.</li>\n<li><b>Honesty:</b> every figure is sourced, every correction is published, and we hold ourselves to the standard we ask of others.</li></ul>\n<h2 id="mission">What we track</h2>\n<ul><li><b>Agora Pharma:</b> prescription and over-the-counter drug prices since 1950, a lookup for every drug, the best price near you, U.S. prices compared with other wealthy countries, taxpayer and private funding behind new drugs, the cost to make and market drugs, and drug-industry mergers.</li>\n<li><b>Agora Health:</b> national health spending, Medicare taxes, premiums and plans, plan types including TRICARE and VA care, claim denials and appeals, Medicare Advantage, reimbursement rates, and the insurers themselves.</li>\n<li><b>Sixteen companies:</b> the largest U.S. drugmakers and public health insurers, with share prices, finances, CEO pay, enforcement records, insider trades, subsidiaries, conflicts of interest and an advisory shareholder ballot.</li></ul>\n<h2 id="act">Taking part</h2>\n<p>Information alone doesn\'t change anything. Agora works only if you participate regularly, offer your own ideas, take legal steps to change your government and society, and spread the word to at least 10 other people. Our <a href="../act/index.html">Take action</a> page explains the lawful, nonpartisan ways anyone can respond: appeals, complaints to regulators, public comments on federal rules, letters to lawmakers, shareholder votes and the ballot box.</p>\n<h2 id="methodology">Methodology &amp; sources</h2>\n<ul><li><b>Prices and inflation:</b> Bureau of Labor Statistics Consumer Price Index series for prescription drugs (since 1947), nonprescription drugs (since 2009), medical services (since 1970) and all items.</li>\n<li><b>Drug-level prices:</b> CMS National Average Drug Acquisition Cost (since 2013), Medicare Part D spending by drug, and FDA approval records.</li>\n<li><b>Spending and payments:</b> CMS National Health Expenditure accounts, Medicare payment files by billing code, the Medicare Trustees Report, MedPAC, and the Peterson-KFF Health System Tracker.</li>\n<li><b>International prices:</b> RAND Corporation, using 2022 IQVIA data for 33 OECD countries.</li>\n<li><b>Taxpayer funding:</b> NIH RePORTER and USAspending.gov, searched live, plus peer-reviewed research on NIH\'s role in new drug approvals. Search totals count projects that mention a term, so they are a floor.</li>\n<li><b>Denials:</b> KFF analyses of federal Marketplace and Medicare Advantage data, HHS inspector general and GAO reports.</li>\n<li><b>Companies:</b> SEC filings (finances, insider trades, merger filings), proxy statements as reported by named trade publications, Good Jobs First\'s Violation Tracker, and federal regulators.</li>\n<li><b>Polls, ballots and price reports</b> come from readers: anyone can take part, once per device. They are unscientific, and ballots have no effect on company votes.</li></ul>\n<h2 id="independence">Independence</h2>\n<p>Agora takes no money from drugmakers, insurers, hospitals or political campaigns, and runs no ads. Nothing here is investment, legal or medical advice.</p>\n<h2 id="corrections">Corrections</h2>\n<p>If you find an error, email <b>corrections@agorasocietystands.com</b> with the page, the figure and a source. Companies and individuals named on the site may respond; we publish substantive responses next to the record. Confirmed corrections are made within two business days and noted on the page.</p>\n<h2 id="roadmap">Future phases</h2>\n<p><b>In short:</b> Agora starts with health care and medicine because rising costs affect every family. From there it grows step by step: following the money, setting public standards for ethical leadership, organizing in our own communities, independent reporting, direct citizen participation and, in time, chapters around the world.</p>\n<ol class="roadmap"><li><span class="rm-n">1</span><div><span class="rm-s rm-live">Live now</span><h3>Agora Pharma &amp; Agora Health</h3><p>What Americans pay for medicine and health coverage, and who profits: drug prices since 1950, denials and appeals, Medicare, sixteen companies, public polls, advisory shareholder ballots and the Take action guide.</p></div></li><li><span class="rm-n">2</span><div><span class="rm-s rm-next">Next</span><h3>Agora Ledger: follow the money</h3><p>Lobbying disclosures, campaign contributions, federal contracts and grants, and government budgets, connected to the companies and officials they touch. More companies: pharmacy benefit managers, hospital systems and generic makers.</p></div></li><li><span class="rm-n">3</span><div><span class="rm-s rm-planned">Planned</span><h3>The Antisociopath Society</h3><p>A membership for people who demand honest government and ethical business. Published, nonpartisan standards; evidence-based ethics grades for companies and leaders with an open scoring method; and recognition for those who meet the standard.</p></div></li><li><span class="rm-n">4</span><div><span class="rm-s rm-planned">Planned</span><h3>Agora Civic: your community</h3><p>Find your representatives and how they vote, follow local meetings and ballot measures, join or start a local chapter, and take on service projects that leave your community better than you found it.</p></div></li><li><span class="rm-n">5</span><div><span class="rm-s rm-planned">Planned</span><h3>Agora Media</h3><p>Sourced, nonpartisan reporting and plain-language explainers, commentary from verified experts, a public corrections log, and a clear wall between reporting and advocacy.</p></div></li><li><span class="rm-n">6</span><div><span class="rm-s rm-planned">Planned</span><h3>Agora Democratic: citizen participation</h3><p>Verified one-person, one-voice polls, structured deliberation on real proposals, and citizen-written ideas sent to the officials who decide. Results are advisory and open to everyone, whatever their politics.</p></div></li><li><span class="rm-n">7</span><div><span class="rm-s rm-future">Future</span><h3>Agora worldwide</h3><p>Local Agora chapters in other countries, in their own languages, under one shared set of values.</p></div></li></ol>\n<p>Each phase opens when the one before it is stable, sourced and trusted, not on a fixed date. Readers help set the order: <a href="mailto:ideas@agorasocietystands.com?subject=Agora%20future%20phases">tell us what matters most to you</a>.</p>\n</div></div>';</script>
